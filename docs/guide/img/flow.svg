<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"><rect width="1200" height="470" rx="10" fill="#0b0b0c"/><defs><marker id="aff5a1f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5a1f"/></marker><marker id="a36d399" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#36d399"/></marker><marker id="aff4b4b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff4b4b"/></marker><marker id="affb224" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb224"/></marker><marker id="a9b988f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b988f"/></marker><marker id="a6aa6ff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6aa6ff"/></marker></defs><text x="36" y="40" text-anchor="start" font-size="13" fill="#ff5a1f" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">FROM TICKET TO PULL REQUEST</text><text x="36" y="62" text-anchor="start" font-size="13" fill="#9b988f" font-weight="400">Nothing is ever merged for you. Every step is bounded and logged.</text><rect x="36" y="120" width="140" height="104" rx="4" fill="#151517" stroke="#ff5a1f" stroke-width="1.6"/><text x="106.0" y="146" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" font-size="13" letter-spacing="1.2" fill="#f2efe8">TICKET</text><text x="106.0" y="168" text-anchor="middle" font-size="12.5" fill="#9b988f">Written by you in</text><text x="106.0" y="185" text-anchor="middle" font-size="12.5" fill="#9b988f">your tracker</text><circle cx="56" cy="106" r="13" fill="#ff5a1f"/><text x="56" y="111" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" font-size="14" fill="#140700">1</text><line x1="178" y1="172.0" x2="194" y2="172.0" stroke="#ff5a1f" stroke-width="2" marker-end="url(#aff5a1f)"/><rect x="196" y="120" width="140" height="104" rx="4" fill="#151517" stroke="#ff5a1f" stroke-width="1.6"/><text x="266.0" y="146" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" font-size="13" letter-spacing="1.2" fill="#f2efe8">CLARITY</text><text x="266.0" y="168" text-anchor="middle" font-size="12.5" fill="#9b988f">Vague? It asks you</text><text x="266.0" y="185" text-anchor="middle" font-size="12.5" fill="#9b988f">for detail first</text><circle cx="216" cy="106" r="13" fill="#ff5a1f"/><text x="216" y="111" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" font-size="14" fill="#140700">2</text><line x1="338" y1="172.0" x2="354" y2="172.0" stroke="#ff5a1f" stroke-width="2" marker-end="url(#aff5a1f)"/><rect x="356" y="120" width="140" height="104" rx="4" fill="#151517" stroke="#ff5a1f" stroke-width="1.6"/><text x="426.0" y="146" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" font-size="13" letter-spacing="1.2" fill="#f2efe8">SANDBOX</text><text x="426.0" y="168" text-anchor="middle" font-size="12.5" fill="#9b988f">Fresh clone in Docker,</text><text x="426.0" y="185" text-anchor="middle" font-size="12.5" fill="#9b988f">AI API only</text><circle cx="376" cy="106" r="13" fill="#ff5a1f"/><text x="376" y="111" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" font-size="14" fill="#140700">3</text><line x1="498" y1="172.0" x2="514" y2="172.0" stroke="#ff5a1f" stroke-width="2" marker-end="url(#aff5a1f)"/><rect x="516" y="120" width="140" height="104" rx="4" fill="#151517" stroke="#ff5a1f" stroke-width="1.6"/><text x="586.0" y="146" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" font-size="13" letter-spacing="1.2" fill="#f2efe8">AGENT</text><text x="586.0" y="168" text-anchor="middle" font-size="12.5" fill="#9b988f">Claude Code or</text><text x="586.0" y="185" text-anchor="middle" font-size="12.5" fill="#9b988f">Codex edits code</text><circle cx="536" cy="106" r="13" fill="#ff5a1f"/><text x="536" y="111" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" font-size="14" fill="#140700">4</text><line x1="658" y1="172.0" x2="674" y2="172.0" stroke="#ff5a1f" stroke-width="2" marker-end="url(#aff5a1f)"/><rect x="676" y="120" width="140" height="104" rx="4" fill="#151517" stroke="#ff5a1f" stroke-width="1.6"/><text x="746.0" y="146" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" font-size="13" letter-spacing="1.2" fill="#f2efe8">VERIFY</text><text x="746.0" y="168" text-anchor="middle" font-size="12.5" fill="#9b988f">Your tests run,</text><text x="746.0" y="185" text-anchor="middle" font-size="12.5" fill="#9b988f">CI files guarded</text><circle cx="696" cy="106" r="13" fill="#ff5a1f"/><text x="696" y="111" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" font-size="14" fill="#140700">5</text><line x1="818" y1="172.0" x2="834" y2="172.0" stroke="#ff5a1f" stroke-width="2" marker-end="url(#aff5a1f)"/><rect x="836" y="120" width="140" height="104" rx="4" fill="#151517" stroke="#ff5a1f" stroke-width="1.6"/><text x="906.0" y="146" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" font-size="13" letter-spacing="1.2" fill="#f2efe8">DRAFT PR</text><text x="906.0" y="168" text-anchor="middle" font-size="12.5" fill="#9b988f">Pushed from the host,</text><text x="906.0" y="185" text-anchor="middle" font-size="12.5" fill="#9b988f">never merged</text><circle cx="856" cy="106" r="13" fill="#ff5a1f"/><text x="856" y="111" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" font-size="14" fill="#140700">6</text><line x1="978" y1="172.0" x2="994" y2="172.0" stroke="#ff5a1f" stroke-width="2" marker-end="url(#aff5a1f)"/><rect x="996" y="120" width="140" height="104" rx="4" fill="#151517" stroke="#36d399" stroke-width="1.6"/><text x="1066.0" y="146" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" font-size="13" letter-spacing="1.2" fill="#f2efe8">YOU</text><text x="1066.0" y="168" text-anchor="middle" font-size="12.5" fill="#9b988f">Review and merge</text><text x="1066.0" y="185" text-anchor="middle" font-size="12.5" fill="#9b988f">or send feedback</text><circle cx="1016" cy="106" r="13" fill="#ff5a1f"/><text x="1016" y="111" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" font-size="14" fill="#140700">7</text><line x1="266.0" y1="226" x2="266.0" y2="300" stroke="#ffb224" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#affb224)"/><rect x="166" y="304" width="200" height="76" rx="4" fill="#151517" stroke="#ffb224" stroke-width="1.6"/><text x="266.0" y="330" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" font-size="13" letter-spacing="1.2" fill="#f2efe8">INBOX</text><text x="266.0" y="352" text-anchor="middle" font-size="12.5" fill="#9b988f">You add the missing detail</text><text x="266.0" y="369" text-anchor="middle" font-size="12.5" fill="#9b988f">and requeue it</text><line x1="168" y1="342" x2="106.0" y2="342" stroke="#ffb224" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#affb224)"/><line x1="106.0" y1="342" x2="106.0" y2="226" stroke="#ffb224" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#affb224)"/><text x="38" y="366" text-anchor="start" font-size="11.5" fill="#ffb224" font-weight="400">back on the line</text><path d="M1066.0 226 V 330 H 586.0 V 230" fill="none" stroke="#6aa6ff" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a6aa6ff)"/><rect x="666" y="304" width="330" height="76" rx="4" fill="#151517" stroke="#6aa6ff" stroke-width="1.6"/><text x="831.0" y="330" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" font-size="13" letter-spacing="1.2" fill="#f2efe8">FEEDBACK LOOP</text><text x="831.0" y="352" text-anchor="middle" font-size="12.5" fill="#9b988f">CI fails, or you comment on the PR:</text><text x="831.0" y="369" text-anchor="middle" font-size="12.5" fill="#9b988f">the agent pushes a fix (3 rounds max)</text><text x="36" y="430" text-anchor="start" font-size="12.5" fill="#9b988f" font-weight="400">Limits on every run: attempts, timeouts, a daily run cap, a pause switch. Token cost and a full audit trail are recorded per run.</text></svg>