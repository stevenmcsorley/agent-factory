<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"><rect width="1200" height="430" rx="10" fill="#0b0b0c"/><defs><marker id="aff5a1f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5a1f"/></marker><marker id="a36d399" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#36d399"/></marker><marker id="aff4b4b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff4b4b"/></marker><marker id="affb224" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffb224"/></marker><marker id="a9b988f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b988f"/></marker><marker id="a6aa6ff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6aa6ff"/></marker></defs><text x="36" y="40" text-anchor="start" font-size="13" fill="#ff5a1f" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">SEVEN GATES BETWEEN A TICKET AND YOUR REPO</text><text x="36" y="62" text-anchor="start" font-size="13" fill="#9b988f" font-weight="400">Ticket text is treated as untrusted. No single gate is relied on alone.</text><rect x="40" y="110" width="140" height="150" rx="4" fill="#151517" stroke="#ff5a1f" stroke-width="1.8"/><circle cx="62" cy="134" r="13" fill="#ff5a1f"/><text x="62" y="139" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" font-size="14" fill="#140700">1</text><text x="110.0" y="172" text-anchor="middle" font-size="14" fill="#f2efe8" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">WHO</text><text x="110.0" y="202" text-anchor="middle" font-size="12.5" fill="#9b988f" font-weight="400">Only your own</text><text x="110.0" y="220" text-anchor="middle" font-size="12.5" fill="#9b988f" font-weight="400">tickets are claimed</text><line x1="181" y1="185" x2="197" y2="185" stroke="#ff5a1f" stroke-width="2" marker-end="url(#aff5a1f)"/><rect x="198" y="110" width="140" height="150" rx="4" fill="#151517" stroke="#ff5a1f" stroke-width="1.8"/><circle cx="220" cy="134" r="13" fill="#ff5a1f"/><text x="220" y="139" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" font-size="14" fill="#140700">2</text><text x="268.0" y="172" text-anchor="middle" font-size="14" fill="#f2efe8" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">CLARITY</text><text x="268.0" y="202" text-anchor="middle" font-size="12.5" fill="#9b988f" font-weight="400">Vague tickets get</text><text x="268.0" y="220" text-anchor="middle" font-size="12.5" fill="#9b988f" font-weight="400">a question, not a run</text><line x1="339" y1="185" x2="355" y2="185" stroke="#ff5a1f" stroke-width="2" marker-end="url(#aff5a1f)"/><rect x="356" y="110" width="140" height="150" rx="4" fill="#151517" stroke="#ff5a1f" stroke-width="1.8"/><circle cx="378" cy="134" r="13" fill="#ff5a1f"/><text x="378" y="139" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" font-size="14" fill="#140700">3</text><text x="426.0" y="172" text-anchor="middle" font-size="14" fill="#f2efe8" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">SANDBOX</text><text x="426.0" y="202" text-anchor="middle" font-size="12.5" fill="#9b988f" font-weight="400">Throwaway container,</text><text x="426.0" y="220" text-anchor="middle" font-size="12.5" fill="#9b988f" font-weight="400">no credentials in it</text><line x1="497" y1="185" x2="513" y2="185" stroke="#ff5a1f" stroke-width="2" marker-end="url(#aff5a1f)"/><rect x="514" y="110" width="140" height="150" rx="4" fill="#151517" stroke="#ff5a1f" stroke-width="1.8"/><circle cx="536" cy="134" r="13" fill="#ff5a1f"/><text x="536" y="139" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" font-size="14" fill="#140700">4</text><text x="584.0" y="172" text-anchor="middle" font-size="14" fill="#f2efe8" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">NETWORK</text><text x="584.0" y="202" text-anchor="middle" font-size="12.5" fill="#9b988f" font-weight="400">No internet except</text><text x="584.0" y="220" text-anchor="middle" font-size="12.5" fill="#9b988f" font-weight="400">the AI API (proxy)</text><line x1="655" y1="185" x2="671" y2="185" stroke="#ff5a1f" stroke-width="2" marker-end="url(#aff5a1f)"/><rect x="672" y="110" width="140" height="150" rx="4" fill="#151517" stroke="#ff5a1f" stroke-width="1.8"/><circle cx="694" cy="134" r="13" fill="#ff5a1f"/><text x="694" y="139" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" font-size="14" fill="#140700">5</text><text x="742.0" y="172" text-anchor="middle" font-size="14" fill="#f2efe8" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">FILES</text><text x="742.0" y="202" text-anchor="middle" font-size="12.5" fill="#9b988f" font-weight="400">CI and config files</text><text x="742.0" y="220" text-anchor="middle" font-size="12.5" fill="#9b988f" font-weight="400">are off limits</text><line x1="813" y1="185" x2="829" y2="185" stroke="#ff5a1f" stroke-width="2" marker-end="url(#aff5a1f)"/><rect x="830" y="110" width="140" height="150" rx="4" fill="#151517" stroke="#ff5a1f" stroke-width="1.8"/><circle cx="852" cy="134" r="13" fill="#ff5a1f"/><text x="852" y="139" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" font-size="14" fill="#140700">6</text><text x="900.0" y="172" text-anchor="middle" font-size="14" fill="#f2efe8" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">LIMITS</text><text x="900.0" y="202" text-anchor="middle" font-size="12.5" fill="#9b988f" font-weight="400">Attempts, time, daily</text><text x="900.0" y="220" text-anchor="middle" font-size="12.5" fill="#9b988f" font-weight="400">caps, pause switch</text><line x1="971" y1="185" x2="987" y2="185" stroke="#ff5a1f" stroke-width="2" marker-end="url(#aff5a1f)"/><rect x="988" y="110" width="140" height="150" rx="4" fill="#151517" stroke="#36d399" stroke-width="1.8"/><circle cx="1010" cy="134" r="13" fill="#ff5a1f"/><text x="1010" y="139" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700" font-size="14" fill="#140700">7</text><text x="1058.0" y="172" text-anchor="middle" font-size="14" fill="#f2efe8" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">HUMAN</text><text x="1058.0" y="202" text-anchor="middle" font-size="12.5" fill="#9b988f" font-weight="400">PRs only. You are</text><text x="1058.0" y="220" text-anchor="middle" font-size="12.5" fill="#9b988f" font-weight="400">the only merge button</text><text x="36" y="310" text-anchor="start" font-size="12.5" fill="#9b988f" font-weight="400">Credentials: git tokens travel as environment variables (never in a command line, URL or log). Tracker tokens live in an owner-only file and can only be named AF_*.</text><text x="36" y="336" text-anchor="start" font-size="12.5" fill="#9b988f" font-weight="400">The UI listens on 127.0.0.1 only, needs a bearer token on every request, checks the Host header, and renders all ticket text as plain text.</text><text x="36" y="362" text-anchor="start" font-size="12.5" fill="#ffb224" font-weight="400">Honest limits: Docker is not a perfect boundary, and a malicious ticket from an allowed author is still a risk. Review every PR.</text></svg>