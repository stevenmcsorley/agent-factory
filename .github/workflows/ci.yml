name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
        env:
          FACTORY_DOCKER_TESTS: "1" # includes the real egress-proxy test (needs Docker, available on the runner)
